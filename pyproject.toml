[project]
name = "milk-man"
version = "0.1.0"
description = "Man with Milk"
readme = "README.md"
authors = [
    { name = "lenhad", email = "lenhad@no.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
milk-man = "milk_man:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
