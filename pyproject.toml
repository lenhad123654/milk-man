[project]
name = "milk-man"
version = "0.1.0"
description = "Interactive CLI and traffic proxy to discover, inspect, and reconcile Django APIs and OpenAPI specifications."
readme = "README.md"
authors = [
    { name = "lenhad" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["api", "django", "openapi", "traffic-proxy", "cli", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
milk-man = "milk_man:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["milk_man", "db", "discover"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
